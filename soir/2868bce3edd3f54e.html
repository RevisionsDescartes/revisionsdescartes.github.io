<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>S&#233;ance avec l'enfant</title>
<style>
:root { --encre: #1c1917; --encre-2: #57534e; --trait: #e7e5e4; --fond: #fafaf9; --carte: #fff;
  --accent: #4338ca; --accent-bg: #eef2ff; --ok: #15803d; --ok-bg: #f0fdf4; --ko: #b45309; --ko-bg: #fffbeb; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.page { max-width: 36rem; margin: 0 auto; padding: 0 16px 40px; }
h1 { font-size: 1.35rem; margin: 18px 0 4px; }
.sous { color: var(--encre-2); margin: 0 0 12px; font-size: .95rem; }
h2 { font-size: 1.08rem; margin: 0 0 10px; color: var(--accent); }
.barre { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; margin: 0 0 12px;
  background: var(--fond); border-bottom: 1px solid var(--trait); font-weight: 600; font-size: .95rem; }
.carte { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 14px; margin: 0 0 14px; }
.lbl { margin: 12px 0 6px; font-size: .78rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--encre-2); }
.consigne { padding: 8px 12px; border-left: 4px solid var(--accent); background: var(--accent-bg); border-radius: 8px; }
.consigne ol, .consigne ul { margin: 4px 0; padding-left: 1.3rem; }
.consigne p { margin: 4px 0; }
.obs { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; background: #f5f5f4; }
.crit { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--trait); }
.crit .ct { flex: 1 1 auto; }
.crit.ok .ct { color: var(--ok); }
.crit.ko .ct { color: var(--ko); }
.oui-non { display: flex; gap: 6px; flex: 0 0 auto; }
.lignes { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
button { font: inherit; border-radius: 999px; padding: 9px 14px; min-height: 44px; border: 1px solid var(--trait); background: var(--carte); color: var(--encre); cursor: pointer; }
button.voir { border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.oui[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
button.non[aria-pressed="true"] { background: var(--ko); border-color: var(--ko); color: #fff; font-weight: 700; }
button.go, button.envoyer { width: 100%; margin-top: 10px; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; font-size: 1.02rem; }
button:disabled { opacity: .5; cursor: not-allowed; }
.r { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-bg); }
.r[hidden], .retour[hidden] { display: none; }
.fig svg { width: 100%; height: auto; display: block; border-radius: 6px; }
.retour { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; }
.retour.ok { background: var(--ok-bg); }
.retour.ko { background: var(--ko-bg); }
.q { font-weight: 600; margin: 0 0 8px; }
ul.l, ol.l { margin: 0; padding-left: 1.2rem; }
ul.l li, ol.l li { margin: 0 0 6px; }
textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--trait); border-radius: 10px; }
.etat { margin: 12px 0 0; padding: 12px; border-radius: 10px; background: var(--trait); font-weight: 600; }
.etat.ok { background: var(--ok-bg); color: var(--ok); }
.etat.ko { background: #fee2e2; color: #7f1d1d; }
.aide { color: var(--encre-2); font-size: .9rem; }
a { color: var(--accent); font-weight: 600; }
</style>
</head>

<div class="page" id="page">

</div>

<script>
(function () {
  "use strict";
  var CLE_ENVOI = "259de897-beba-4c71-95c8-dcde527b79c1";
  var page = document.getElementById("page");
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function html(tag, cls, h) { var e = el(tag, cls); e.innerHTML = h; return e; }
  function texte(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent.replace(/\s+/g, " ").trim(); }
  function deux(n) { n = String(n); return n.length < 2 ? "0" + n : n; }
  function octets(b64) {
    b64 = b64.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var s = atob(b64), t = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) t[i] = s.charCodeAt(i);
    return t;
  }
  function echec() {
    page.innerHTML = "";
    page.appendChild(el("h1", null, "S\u00e9ance avec l'enfant"));
    page.appendChild(el("p", "aide", "Cette page s'ouvre depuis le tableau de bord, avec son lien complet."));
  }
  var m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash);
  if (!m || !window.crypto || !crypto.subtle) { echec(); return; }
  var blob = octets(window.ATELIER_CHIFFRE);
  crypto.subtle.importKey("raw", octets(m[1]), { name: "AES-GCM" }, false, ["decrypt"])
    .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12) }, k, blob.slice(12)); })
    .then(function (buf) { afficher(JSON.parse(new TextDecoder().decode(buf))); })
    .catch(echec);

  function afficher(A) {
    var CLE = "rev-atelier:" + A.identifiant;
    var st = { debut: 0, crit: {}, oral: {}, indice: {}, obs: "", envoye: null, duree: 0 };
    try { var lu = JSON.parse(localStorage.getItem(CLE) || "null"); if (lu && lu.crit) st = lu; } catch (e) {}
    function garder() { try { localStorage.setItem(CLE, JSON.stringify(st)); } catch (e) {} }
    var nbCrit = 0;
    A.exercices.forEach(function (x) { nbCrit += x.criteres.length; });
    var reps = [];
    page.innerHTML = "";
    document.title = "S\u00e9ance avec " + A.enfant;
    page.appendChild(el("h1", null, "S\u00e9ance avec " + A.enfant));
    page.appendChild(el("p", "sous", A.titre_court + " \u00b7 environ " + A.duree + " minutes. Il trace et r\u00e9pond ; vous notez."));
    var barre = el("div", "barre"), chrono = el("span", "chrono"), prog = el("span", "prog");
    barre.appendChild(chrono); barre.appendChild(prog); page.appendChild(barre);

    // ---- avant de commencer
    var av = el("div", "carte");
    av.appendChild(el("h2", null, "Avant de commencer"));
    var pf = el("p");
    pf.appendChild(document.createTextNode("Sa feuille : "));
    var a1 = el("a", null, "l'ouvrir"); a1.href = A.feuille.lien; a1.target = "_blank"; a1.rel = "noopener";
    var a2 = el("a", null, "l'imprimer (PDF)"); a2.href = A.feuille.pdf; a2.target = "_blank"; a2.rel = "noopener";
    pf.appendChild(a1); pf.appendChild(document.createTextNode(" \u00b7 ")); pf.appendChild(a2);
    av.appendChild(pf);
    av.appendChild(el("p", "lbl", "Mat\u00e9riel"));
    var um = el("ul", "l"); A.materiel.forEach(function (t) { um.appendChild(html("li", null, t)); }); av.appendChild(um);
    av.appendChild(el("p", "lbl", "Comment noter"));
    var ur = el("ol", "l"); A.regles.forEach(function (t) { ur.appendChild(html("li", null, t)); }); av.appendChild(ur);
    var go = el("button", "go", "Commencer : lancer le chrono"); go.type = "button";
    go.addEventListener("click", function () { if (!st.debut) { st.debut = Date.now(); garder(); } maj(); });
    av.appendChild(go);
    page.appendChild(av);

    // ---- exercices
    A.exercices.forEach(function (x, i) {
      var c = el("div", "carte");
      c.appendChild(el("h2", null, "Exercice " + (i + 1) + " \u00b7 " + x.titre));
      var cons = el("div", "consigne"); cons.appendChild(html("div", null, x.consigne)); c.appendChild(cons);
      if (x.observer) c.appendChild(html("p", "obs", "<b>Pendant qu'il trace :</b> " + x.observer));
      c.appendChild(el("p", "lbl", "Son premier essai"));
      x.criteres.forEach(function (cr, j) {
        var cle = i + "-" + j;
        var r = el("div", "crit");
        r.appendChild(html("span", "ct", cr.t));
        var oui = el("button", "oui", "Oui"), non = el("button", "non", "Non");
        oui.type = "button"; non.type = "button";
        var b = el("div", "oui-non"); b.appendChild(oui); b.appendChild(non); r.appendChild(b);
        function peindre() {
          var v = st.crit[cle];
          oui.setAttribute("aria-pressed", v === true ? "true" : "false");
          non.setAttribute("aria-pressed", v === false ? "true" : "false");
          r.className = "crit" + (v === true ? " ok" : (v === false ? " ko" : ""));
        }
        oui.addEventListener("click", function () { st.crit[cle] = true; garder(); maj(); });
        non.addEventListener("click", function () { st.crit[cle] = false; garder(); maj(); });
        reps.push(peindre);
        c.appendChild(r);
      });
      var outils = el("div", "lignes");
      var bi = el("button", "voir", "Indice"), bc = el("button", "voir", "Voir le corrig\u00e9");
      bi.type = "button"; bc.type = "button";
      outils.appendChild(bi); outils.appendChild(bc); c.appendChild(outils);
      var ind = html("div", "r", "<b>Indice</b>, seulement apr\u00e8s son premier essai : " + x.indice);
      var cor = el("div", "r");
      cor.appendChild(html("div", "fig", x.corrige));
      cor.appendChild(html("p", null, x.corrige_txt));
      cor.hidden = true;
      bi.addEventListener("click", function () { st.indice[i] = true; garder(); maj(); });
      bc.addEventListener("click", function () { cor.hidden = !cor.hidden; bc.textContent = cor.hidden ? "Voir le corrig\u00e9" : "Masquer le corrig\u00e9"; });
      c.appendChild(ind); c.appendChild(cor);
      var ret = el("div", "retour"); ret.hidden = true; c.appendChild(ret);
      reps.push(function () {
        ind.hidden = !st.indice[i];
        var vals = x.criteres.map(function (cr, j) { return st.crit[i + "-" + j]; });
        if (vals.some(function (v) { return v === undefined; })) { ret.hidden = true; return; }
        var tous = vals.every(function (v) { return v === true; });
        ret.hidden = false;
        ret.className = "retour " + (tous ? "ok" : "ko");
        ret.innerHTML = "<b>\u00c0 lui dire :</b> " + (tous ? x.bravo : x.si_rate + "<br>Puis l'indice : il recommence. La note ne change pas.");
      });
      page.appendChild(c);
    });

    // ---- questions orales (elles remplacent la page du soir)
    var co = el("div", "carte");
    co.appendChild(el("h2", null, "Les 3 questions, \u00e0 voix haute"));
    co.appendChild(el("p", "aide", "Feuille retourn\u00e9e. Posez la question, laissez-le chercher, puis regardez la r\u00e9ponse."));
    A.oral.forEach(function (q, k) {
      var b = el("div", "crit");
      b.style.display = "block";
      b.appendChild(html("p", "q", q.q));
      var rep = html("div", "r", q.r); rep.hidden = true;
      var voir = el("button", "voir", "Voir la r\u00e9ponse"); voir.type = "button";
      var oui = el("button", "oui", "Su"), non = el("button", "non", "Pas su");
      oui.type = "button"; non.type = "button";
      var lg = el("div", "lignes"); lg.appendChild(voir); lg.appendChild(oui); lg.appendChild(non);
      b.appendChild(lg); b.appendChild(rep);
      voir.addEventListener("click", function () { rep.hidden = false; voir.hidden = true; });
      oui.addEventListener("click", function () { st.oral[k] = true; garder(); maj(); });
      non.addEventListener("click", function () { st.oral[k] = false; garder(); maj(); });
      reps.push(function () {
        var v = st.oral[k];
        oui.setAttribute("aria-pressed", v === true ? "true" : "false");
        non.setAttribute("aria-pressed", v === false ? "true" : "false");
        if (v !== undefined) { rep.hidden = false; voir.hidden = true; }
      });
      co.appendChild(b);
    });
    page.appendChild(co);

    // ---- remarques
    var cr2 = el("div", "carte");
    cr2.appendChild(el("h2", null, "Ce que vous avez remarqu\u00e9 (facultatif)"));
    var ta = el("textarea"); ta.rows = 3; ta.value = st.obs || "";
    ta.placeholder = "Par exemple : tient bien l'\u00e9querre ; oublie de prolonger.";
    ta.addEventListener("input", function () { st.obs = ta.value; garder(); });
    cr2.appendChild(ta);
    page.appendChild(cr2);

    // ---- fin
    var fin = el("div", "carte");
    fin.appendChild(el("h2", null, "Fini"));
    var dire = el("div", "retour ok"); dire.hidden = true; fin.appendChild(dire);
    var bouton = el("button", "envoyer", "Envoyer le bilan"); bouton.type = "button";
    var etat = el("p", "etat"); etat.hidden = true;
    fin.appendChild(bouton); fin.appendChild(etat);
    page.appendChild(fin);

    function minutes() { return Math.max(1, Math.round((Date.now() - st.debut) / 60000)); }
    function nbNotes() { var n = 0; for (var c in st.crit) if (st.crit[c] !== undefined) n++; return n; }
    function oralFini() { return A.oral.every(function (q, k) { return st.oral[k] !== undefined; }); }
    function resultats() {
      var pal = [[0, 0], [0, 0], [0, 0]], lignes = [], manques = [], reussis = [], num = 0;
      A.exercices.forEach(function (x, i) {
        var tout = true;
        x.criteres.forEach(function (cr, j) {
          var ok = st.crit[i + "-" + j] === true;
          num++;
          pal[x.palier - 1][1]++;
          if (ok) pal[x.palier - 1][0]++;
          else {
            tout = false;
            var comp = cr.competence || x.competence;
            if (manques.indexOf(comp) < 0) manques.push(comp);
          }
          lignes.push("  " + num + ". " + x.court + " \u00b7 " + texte(cr.t) + (ok ? " [ok]" : " [rat\u00e9]"));
        });
        if (tout && reussis.indexOf(x.reussi) < 0) reussis.push(x.reussi);
      });
      var o = 0; A.oral.forEach(function (q, k) { if (st.oral[k] === true) o++; });
      return { pal: pal, lignes: lignes, manques: manques, reussis: reussis, oral: o };
    }
    function fr(p) { return p[1] ? p[0] + "/" + p[1] : "\u2014"; }
    function liste(a) { return a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " et " + a[a.length - 1]; }
    function minus(t) { return t.charAt(0).toLowerCase() + t.slice(1); }
    function bilan() {
      var R = resultats(), d = st.duree || minutes(), l = [];
      var nInd = 0; for (var c in st.indice) if (st.indice[c]) nInd++;
      l.push("S\u00e9ance : " + A.identifiant);
      l.push("Le\u00e7on : " + A.titre);
      l.push("S\u00e9ance accompagn\u00e9e : not\u00e9e par le parent");
      l.push("Bases " + fr(R.pal[0]) + " \u00b7 Application " + fr(R.pal[1]) + " \u00b7 Probl\u00e8mes " + fr(R.pal[2]));
      l.push("D\u00e9fi (le\u00e7on ferm\u00e9e) : " + R.oral + "/" + A.oral.length + " \u2014 questions orales");
      A.oral.forEach(function (q, k) { l.push("  D" + (k + 1) + ". " + texte(q.q) + (st.oral[k] === true ? " [ok]" : " [rat\u00e9]")); });
      l.push("Dur\u00e9e : " + d + " min \u00b7 Indices ouverts : " + nInd + " \u00b7 Retours \u00e0 la le\u00e7on : 0");
      l.push("Validation : valid\u00e9e (s\u00e9ance accompagn\u00e9e, " + d + " min)");
      l.push("");
      l.push("Exercices pos\u00e9s");
      R.lignes.forEach(function (x) { l.push(x); });
      l.push("");
      l.push("Comp\u00e9tences manqu\u00e9es");
      if (R.manques.length) R.manques.forEach(function (x) { l.push("  - " + x); }); else l.push("  aucune");
      l.push("");
      l.push("Signalements de l'enfant");
      l.push("  aucun");
      l.push("");
      l.push("Observations du parent");
      l.push("  " + (String(st.obs || "").replace(/\s+/g, " ").trim() || "aucune"));
      l.push("");
      l.push("pilote V3 \u00b7 s\u00e9ance accompagn\u00e9e (1er novembre)");
      return { sujet: "[REV] " + A.identifiant + " \u2014 " + fr(R.pal[0]) + " \u00b7 " + fr(R.pal[1]) + " \u00b7 " + fr(R.pal[2]), texte: l.join("\n") };
    }
    function maj() {
      reps.forEach(function (f) { f(); });
      var n = nbNotes();
      prog.textContent = n + "/" + nbCrit + " points not\u00e9s";
      if (st.envoye) chrono.textContent = "Dur\u00e9e : " + st.duree + " min";
      else chrono.textContent = st.debut ? "Chrono : " + minutes() + " min" : "Chrono pas lanc\u00e9";
      go.disabled = !!st.debut;
      go.textContent = st.debut ? "Chrono lanc\u00e9" : "Commencer : lancer le chrono";
      var fini = !!st.debut && n === nbCrit && oralFini();
      if (n === nbCrit) {
        var R = resultats();
        dire.hidden = false;
        dire.innerHTML = "<b>\u00c0 lui dire, d'abord :</b> " + (R.reussis.length ? "tu sais " + liste(R.reussis) + "." : "tu as essay\u00e9 chaque figure, c'est comme \u00e7a qu'on progresse.")
          + (R.manques.length ? "<br><b>Puis une seule chose \u00e0 revoir :</b> " + minus(R.manques[0]) + "." : "");
      } else dire.hidden = true;
      bouton.disabled = !fini || !!st.envoye;
      if (st.envoye) { bouton.textContent = "Bilan envoy\u00e9"; etat.hidden = false; etat.className = "etat ok"; etat.textContent = "Envoy\u00e9 le " + st.envoye + ". Merci !"; }
      else if (!st.debut) bouton.textContent = "Envoyer le bilan (lancez d'abord le chrono)";
      else if (!fini) bouton.textContent = "Envoyer le bilan (notez tout)";
      else bouton.textContent = "Envoyer le bilan";
    }
    setInterval(function () { if (st.debut && !st.envoye) chrono.textContent = "Chrono : " + minutes() + " min"; }, 20000);
    bouton.addEventListener("click", function () {
      if (bouton.disabled) return;
      st.duree = minutes(); garder();
      var b = bilan(), f = new FormData();
      f.append("access_key", CLE_ENVOI); f.append("subject", b.sujet);
      f.append("from_name", "S\u00e9ance accompagn\u00e9e"); f.append("message", b.texte);
      bouton.disabled = true; bouton.textContent = "Envoi\u2026";
      fetch("https://api.web3forms.com/submit", { method: "POST", body: f })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || !d.success) throw new Error("refus\u00e9");
          var t = new Date();
          st.envoye = deux(t.getDate()) + "/" + deux(t.getMonth() + 1) + " \u00e0 " + deux(t.getHours()) + ":" + deux(t.getMinutes());
          garder(); maj();
        })
        .catch(function () {
          st.duree = 0; garder();
          bouton.disabled = false; bouton.textContent = "R\u00e9essayer l'envoi";
          etat.hidden = false; etat.className = "etat ko"; etat.textContent = "Envoi impossible. V\u00e9rifiez la connexion, puis r\u00e9essayez.";
        });
    });
    maj();
  }
})();
</script>
</body>
</html>
