# Test ponctuel : Proxirest répond-il depuis les serveurs GitHub ?
# Aucune donnée personnelle : pas de matricule, pas d'e-mail. Supprimable après le test.
name: Diagnostic Proxirest
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnostic-proxirest.yml'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger Proxirest
        run: |
          mkdir -p archives/2026-11-09-diagnostic-proxirest
          OUT=archives/2026-11-09-diagnostic-proxirest/resultat.txt
          {
            echo "Date UTC : $(date -u +%FT%TZ)"
            echo "Pays du serveur GitHub : $(curl -s -m 10 https://ipinfo.io/country || echo inconnu)"
            for URL in \
              "https://proxirest.ma/epaiement/FR/parcours" \
              "https://proxirest.ma/epaiement/FR/traitement?action=ecoles"; do
              curl -sS -m 30 -A "Mozilla/5.0" -o /tmp/r.html -w "HTTP %{http_code} | %{size_download} octets | $URL\n" "$URL" || echo "ECHEC $URL"
              echo "  mentions captcha/cloudflare/blocage : $(grep -ciE 'captcha|cloudflare|just a moment|access denied|forbidden' /tmp/r.html || true)"
              echo "  extrait blocage : $(grep -iE 'captcha|cloudflare|just a moment|access denied|forbidden' /tmp/r.html | head -2 | cut -c1-220)"
              echo "  mentions Descartes : $(grep -ci 'descartes' /tmp/r.html || true)"
            done
          } | tee "$OUT"
      - name: Enregistrer le résultat
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add archives/2026-11-09-diagnostic-proxirest/resultat.txt
          git commit -m "Diagnostic Proxirest (résultat du test)" || exit 0
          git push
