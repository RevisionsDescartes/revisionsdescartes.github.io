<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Nouvelle s&#233;ance</title>
<style>
:root { --encre: #1c1917; --encre-2: #57534e; --trait: #e7e5e4; --fond: #fafaf9; --carte: #fff; --accent: #4338ca; --accent-bg: #eef2ff; --ok: #15803d; --ok-bg: #f0fdf4; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.page { max-width: 34rem; margin: 0 auto; padding: 18px 16px 40px; }
h1 { font-size: 1.35rem; margin: 0 0 12px; }
.carte { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 14px; margin: 0 0 14px; }
.lbl { color: var(--encre-2); font-size: .85rem; margin: 0; }
.val { margin: 0 0 10px; font-weight: 600; }
textarea { width: 100%; min-height: 90px; font: inherit; border: 1px solid var(--trait); border-radius: 10px; padding: 10px; }
button { width: 100%; font: inherit; font-weight: 700; border-radius: 999px; padding: 12px 16px; min-height: 48px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .5; }
.etat { margin: 12px 0 0; padding: 12px; border-radius: 10px; background: var(--trait); font-weight: 600; }
.etat.ok { background: var(--ok-bg); color: var(--ok); }
.etat.ko { background: #fee2e2; color: #7f1d1d; }
.aide { color: var(--encre-2); font-size: .9rem; }
</style>
</head>
<body>
<div class="page" id="page">
  <h1>Nouvelle s&#233;ance</h1>
  <div id="contenu"><p class="aide">Cette page s'ouvre depuis le tableau de bord, bouton &#171; Nouvelle s&#233;ance &#187;.</p></div>
</div>
<script>
(function () {
  "use strict";
  var CLE_ENVOI = "259de897-beba-4c71-95c8-dcde527b79c1";
  var q = new URLSearchParams(location.hash.slice(1));
  var D = { e: q.get("e") || "", id: q.get("id") || "", t: q.get("t") || "", c: q.get("c") || "", m: q.get("m") || "" };
  if (!D.e || !D.id) return;
  var box = document.getElementById("contenu");
  function el(tag, cls, txt) { var x = document.createElement(tag); if (cls) x.className = cls; if (txt != null) x.textContent = txt; return x; }
  box.innerHTML = "";
  var c = el("div", "carte");
  [["Pour", D.e], ["Mati\u00e8re", D.m], ["Chapitre", D.c], ["Sur le th\u00e8me de", D.t]].forEach(function (p) {
    if (!p[1]) return;
    c.appendChild(el("p", "lbl", p[0]));
    c.appendChild(el("p", "val", p[1]));
  });
  box.appendChild(c);
  box.appendChild(el("p", "lbl", "Une pr\u00e9cision ? (facultatif : ce qui coince, ce que tu veux en plus)"));
  var txt = el("textarea"); box.appendChild(txt);
  box.appendChild(el("p", "aide", "La nouvelle s\u00e9ance sera faite au prochain \u00ab g\u00e9n\u00e8re pour " + D.e + " \u00bb."));
  var b = el("button", null, "Envoyer la demande"); b.type = "button"; box.appendChild(b);
  var etat = el("p", "etat"); etat.hidden = true; box.appendChild(etat);
  var CLE = "rev-demande:" + D.id, deja = null;
  try { deja = localStorage.getItem(CLE); } catch (e) {}
  if (deja) { etat.hidden = false; etat.className = "etat"; etat.textContent = "D\u00e9j\u00e0 demand\u00e9e le " + deja + ". Tu peux la redemander si tu veux pr\u00e9ciser."; }
  b.addEventListener("click", function () {
    var l = ["Demande : nouvelle s\u00e9ance", "Enfant : " + D.e, "S\u00e9ance : " + D.id, "Mati\u00e8re : " + D.m, "Chapitre : " + D.c,
             "Sur : " + D.t, "Pr\u00e9cision : " + (txt.value.trim() || "aucune"), "", "pilote V3 \u00b7 demande depuis le tableau de bord (27 octobre)"];
    var f = new FormData();
    f.append("access_key", CLE_ENVOI);
    f.append("subject", "[DEMANDE] " + D.id + " \u2014 nouvelle s\u00e9ance");
    f.append("from_name", "Tableau de bord");
    f.append("message", l.join("\n"));
    b.disabled = true; b.textContent = "Envoi\u2026";
    fetch("https://api.web3forms.com/submit", { method: "POST", body: f })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.success) throw new Error("refus\u00e9");
        var t = new Date(), z = function (n) { return String(n).padStart(2, "0"); };
        var quand = z(t.getDate()) + "/" + z(t.getMonth() + 1) + " \u00e0 " + z(t.getHours()) + ":" + z(t.getMinutes());
        try { localStorage.setItem(CLE, quand); } catch (e) {}
        etat.hidden = false; etat.className = "etat ok";
        etat.textContent = "Demande envoy\u00e9e. Elle sera trait\u00e9e au prochain \u00ab g\u00e9n\u00e8re pour " + D.e + " \u00bb. Tu peux fermer cette page.";
        b.textContent = "Demande envoy\u00e9e";
      })
      .catch(function () {
        b.disabled = false; b.textContent = "R\u00e9essayer";
        etat.hidden = false; etat.className = "etat ko"; etat.textContent = "Envoi impossible. V\u00e9rifie la connexion, puis r\u00e9essaie.";
      });
  });
})();
</script>
</body>
</html>
