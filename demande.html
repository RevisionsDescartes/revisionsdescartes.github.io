<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Nouvelle séance</title>
<style>
:root { --encre: #1c1917; --encre-2: #57534e; --trait: #e7e5e4; --fond: #fafaf9; --carte: #fff; --accent: #4338ca; --accent-bg: #eef2ff; --ok: #15803d; --ok-bg: #f0fdf4; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.page { max-width: 34rem; margin: 0 auto; padding: 18px 16px 40px; }
h1 { font-size: 1.35rem; margin: 0 0 12px; }
h2 { font-size: 1.1rem; margin: 0 0 8px; }
.carte { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 14px; margin: 0 0 14px; }
.carte.message { border-color: var(--accent); background: var(--accent-bg); }
.lbl { color: var(--encre-2); font-size: .85rem; margin: 0; }
.val { margin: 0 0 10px; font-weight: 600; }
textarea { width: 100%; min-height: 90px; font: inherit; border: 1px solid var(--trait); border-radius: 10px; padding: 10px; background: #fff; color: var(--encre); }
textarea.prompt { min-height: 330px; font-size: .95rem; line-height: 1.45; }
button { width: 100%; font: inherit; font-weight: 700; border-radius: 999px; padding: 12px 16px; min-height: 48px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; margin: 10px 0 0; }
button.copie-ok { background: var(--ok); border-color: var(--ok); }
button:disabled { opacity: .5; }
.etape { margin: 0 0 8px; }
.etat { margin: 12px 0 0; padding: 12px; border-radius: 10px; background: var(--trait); font-weight: 600; }
.etat.ok { background: var(--ok-bg); color: var(--ok); }
.aide { color: var(--encre-2); font-size: .9rem; }
</style>
</head>
<body>
<div class="page" id="page">
  <h1>Nouvelle séance</h1>
  <div id="contenu"><p class="aide">Cette page s'ouvre depuis le tableau de bord, bouton « Nouvelle séance ».</p></div>
</div>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.hash.slice(1));
  var D = { e: q.get("e") || "", id: q.get("id") || "", t: q.get("t") || "", c: q.get("c") || "", m: q.get("m") || "" };
  if (!D.e || !D.id) return;
  var box = document.getElementById("contenu");
  function el(tag, cls, txt) { var x = document.createElement(tag); if (cls) x.className = cls; if (txt != null) x.textContent = txt; return x; }
  function z(n) { return String(n).padStart(2, "0"); }
  function maintenant() { var t = new Date(); return z(t.getDate()) + "/" + z(t.getMonth() + 1) + " à " + z(t.getHours()) + ":" + z(t.getMinutes()); }

  // Le message à coller dans Claude : complet, pour qu'une nouvelle conversation du projet le comprenne seule.
  function message(precision, quand) {
    return [
      "Génère la séance demandée pour " + D.e + " (procédure « Nouvelle séance demandée » de LISEZMOI.md).",
      "Séance d'origine : " + D.id,
      "Matière : " + (D.m || "?"),
      "Chapitre : " + (D.c || "?"),
      "Sur : " + (D.t || "?"),
      "Précision : " + (precision ? precision.replace(/\s*\n+\s*/g, " / ") : "aucune"),
      "Demande du " + quand + "."
    ].join("\n");
  }

  box.innerHTML = "";
  var c = el("div", "carte");
  [["Pour", D.e], ["Matière", D.m], ["Chapitre", D.c], ["Sur le thème de", D.t]].forEach(function (p) {
    if (!p[1]) return;
    c.appendChild(el("p", "lbl", p[0]));
    c.appendChild(el("p", "val", p[1]));
  });
  box.appendChild(c);
  box.appendChild(el("p", "lbl", "Une précision ? (facultatif : ce qui coince, ce que tu veux en plus)"));
  var txt = el("textarea"); box.appendChild(txt);
  var b = el("button", null, "Préparer le message pour Claude"); b.type = "button"; box.appendChild(b);
  var CLE = "rev-demande:" + D.id, deja = null;
  try { deja = localStorage.getItem(CLE); } catch (e) {}
  var etat = el("p", "etat"); etat.hidden = !deja; box.appendChild(etat);
  if (deja) etat.textContent = "Message déjà préparé le " + deja + ". Tu peux le refaire, par exemple pour changer la précision.";

  // Bloc « message pour Claude », affiché après « Préparer ».
  var zone = el("div", "carte message"); zone.hidden = true;
  zone.appendChild(el("h2", null, "À envoyer à Claude"));
  zone.appendChild(el("p", "etape", "1. Touche « Copier le message »."));
  zone.appendChild(el("p", "etape", "2. Dans Claude, ouvre le projet « Outil De Révision » et colle le message dans une conversation."));
  zone.appendChild(el("p", "etape", "3. Envoie : la séance est faite tout de suite et arrive dans le tableau de bord."));
  var prompt = el("textarea", "prompt"); prompt.readOnly = true; prompt.setAttribute("aria-label", "Message pour Claude");
  zone.appendChild(prompt);
  var copier = el("button", null, "Copier le message"); copier.type = "button"; zone.appendChild(copier);
  zone.appendChild(el("p", "aide", "Rien n'est fait sans ce message. Pour avoir la séance dans le prochain lot plutôt que tout de suite, colle-le avec « génère pour " + D.e + " »."));
  box.appendChild(zone);

  function copierTexte(t) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
    return new Promise(function (ok, ko) {
      prompt.focus(); prompt.select();
      try { if (document.execCommand("copy")) ok(); else ko(new Error("copie")); } catch (e) { ko(e); }
    });
  }
  copier.addEventListener("click", function () {
    copierTexte(prompt.value).then(function () {
      copier.textContent = "Message copié ✓"; copier.className = "copie-ok";
    }, function () {
      prompt.focus(); prompt.select();
      copier.textContent = "Sélectionné : appuie longuement, puis Copier";
    });
  });

  b.addEventListener("click", function () {
    var quand = maintenant();
    prompt.value = message(txt.value.trim(), quand);
    zone.hidden = false;
    copier.textContent = "Copier le message"; copier.className = "";
    b.textContent = "Refaire le message";
    try { localStorage.setItem(CLE, quand); } catch (e) {}
    etat.hidden = false; etat.className = "etat ok";
    etat.textContent = "Message préparé le " + quand + ". Copie-le, puis envoie-le à Claude.";
    zone.scrollIntoView({ behavior: "smooth", block: "start" });
  });
})();
</script>
</body>
</html>
