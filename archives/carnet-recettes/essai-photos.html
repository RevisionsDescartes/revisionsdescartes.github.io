<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Essai photos</title>
<style>
:root{--bg:#F4F6FB;--fg:#1B2236;--card:#fff;--line:#DDE2EE;--muted:#5B6478}
@media (prefers-color-scheme:dark){:root{--bg:#0F1426;--fg:#EEF0FA;--card:#161C33;--line:#2A3150;--muted:#A7AECB}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto}h1{font-size:1.3rem;margin:.2rem 0 .3rem}h2{font-size:1.05rem;margin:1.4rem 0 .6rem}p{color:var(--muted);margin:.3rem 0}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}li:first-child{border-top:0}
.th{width:3.2rem;height:2.2rem;border-radius:.45rem;overflow:hidden;flex:none;background:var(--line)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.rn{flex:1;font-weight:600;line-height:1.25}.cat{font-size:.8rem;color:var(--muted)}
.big{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.big figure{margin:0}.big img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;display:block;background:var(--line)}
figcaption{font-size:.8rem;color:var(--muted);margin-top:4px}
</style></head><body><main>
<h1>Essai : vraies photos par catégorie</h1>
<p>Aperçu seulement, rien n'est changé dans le carnet. Photos libres de droits (licence Unsplash).</p>
<h2>Dans la liste, taille réelle</h2>
<ul id="rows"></ul>
<h2>En grand</h2>
<div class="big" id="big"></div>
</main>
<script>
var P=[
 ['Poulet caramélisé + riz blanc','poulet','1616401616927-3c81de22dfa8','Annie Spratt'],
 ['Cheesecake facile','gâteau','1661349008075-62f1479f311d','Christina'],
 ['Mayonnaise : oeufs durs, ail grillé…','œufs','1628484641099-0e7ae67fbdc1','Hasan Almasi'],
 ['Boules biscuits enrobées de chocolat','chocolat','1617669490110-0c9585fedc01','Joseph Costa'],
 ['Snacks Pain perdu Fromage Charcuterie','pain, sandwich','1475090169767-40ed8d18f67d','Asnim Ansari'],
 ['Pancakes bananes avocat','pancakes, crêpes','1598259176132-296706ba781a','Yente Van Eynde']];
function img(id,w,h){var i=document.createElement('img');i.alt='';i.loading='lazy';i.src='https://images.unsplash.com/photo-'+id+'?w='+w+'&h='+h+'&fit=crop&q=60&auto=format';return i;}
P.forEach(function(p){
 var li=document.createElement('li'),th=document.createElement('span');th.className='th';th.appendChild(img(p[2],112,76));
 var t=document.createElement('span');t.className='rn';t.textContent=p[0];var c=document.createElement('div');c.className='cat';c.textContent='Vignette : '+p[1];t.appendChild(c);
 li.appendChild(th);li.appendChild(t);document.getElementById('rows').appendChild(li);
 var f=document.createElement('figure');f.appendChild(img(p[2],480,320));var fc=document.createElement('figcaption');fc.textContent=p[1]+' · photo '+p[3]+' (Unsplash)';f.appendChild(fc);document.getElementById('big').appendChild(f);
});
</script></body></html>
