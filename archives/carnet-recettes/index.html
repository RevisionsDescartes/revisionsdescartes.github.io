<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2238B4">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Carnet de recettes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Concept : une carte de restaurant en trois niveaux. Accueil = types de plats seuls,
   puis la liste des plats d'un type, puis la fiche d'un plat (ingrédients + recette).
   Chaque type a sa couleur et son illustration. Plats et Accompagnements ouvrent la carte
   en tuiles pleines. Ambre réservé aux informations incomplètes. */
:root {
  --bg: #F4F6FB;
  --surface: #FFFFFF;
  --fg: #161D38;
  --muted: #566080;
  --line: #DCE1EF;
  --accent: #2238B4;
  --on-accent: #FFFFFF;
  --accent-soft: #E4E9FB;
  --warn-bg: #FFF1CF;
  --warn-fg: #5E4300;
  --danger: #B3261E;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --k-plats:#AB413E;--k-plats-on:#FFFFFF;--k-accomp:#007D69;--k-accomp-on:#FFFFFF;--k-petit-dej:#7355A9;--k-petit-dej-on:#FFFFFF;--k-salades:#467922;--k-salades-on:#FFFFFF;--k-soupes:#A05000;--k-soupes-on:#FFFFFF;--k-tajines:#866300;--k-tajines-on:#FFFFFF;--k-sandwichs:#3568B2;--k-sandwichs-on:#FFFFFF;--k-snacks:#007694;--k-snacks-on:#FFFFFF;--k-desserts:#9A4485;--k-desserts-on:#FFFFFF;--k-aclasser:#626975;--k-aclasser-on:#FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1325;
    --surface: #161D36;
    --fg: #E9ECF8;
    --muted: #9AA4C6;
    --line: #28315A;
    --accent: #93A8FF;
    --on-accent: #0E1325;
    --accent-soft: #1F2A5A;
    --warn-bg: #3A2F10;
    --warn-fg: #F2D789;
    --danger: #FF9C93;
    color-scheme: dark;
    --k-plats:#F69B94;--k-plats-on:#12141F;--k-accomp:#5CCEB7;--k-accomp-on:#12141F;--k-petit-dej:#C0A8F5;--k-petit-dej-on:#12141F;--k-salades:#99C77F;--k-salades-on:#12141F;--k-soupes:#EEA471;--k-soupes-on:#12141F;--k-tajines:#D8B260;--k-tajines-on:#12141F;--k-sandwichs:#8BB9FD;--k-sandwichs-on:#12141F;--k-snacks:#59C8E8;--k-snacks-on:#12141F;--k-desserts:#E59CD0;--k-desserts-on:#12141F;--k-aclasser:#B0B8C5;--k-aclasser-on:#12141F;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1325;
  --surface: #161D36;
  --fg: #E9ECF8;
  --muted: #9AA4C6;
  --line: #28315A;
  --accent: #93A8FF;
  --on-accent: #0E1325;
  --accent-soft: #1F2A5A;
  --warn-bg: #3A2F10;
  --warn-fg: #F2D789;
  --danger: #FF9C93;
  color-scheme: dark;
  --k-plats:#F69B94;--k-plats-on:#12141F;--k-accomp:#5CCEB7;--k-accomp-on:#12141F;--k-petit-dej:#C0A8F5;--k-petit-dej-on:#12141F;--k-salades:#99C77F;--k-salades-on:#12141F;--k-soupes:#EEA471;--k-soupes-on:#12141F;--k-tajines:#D8B260;--k-tajines-on:#12141F;--k-sandwichs:#8BB9FD;--k-sandwichs-on:#12141F;--k-snacks:#59C8E8;--k-snacks-on:#12141F;--k-desserts:#E59CD0;--k-desserts-on:#12141F;--k-aclasser:#B0B8C5;--k-aclasser-on:#12141F;
}
.t-plats{--c:var(--k-plats);--on-c:var(--k-plats-on)}
.t-accomp{--c:var(--k-accomp);--on-c:var(--k-accomp-on)}
.t-petit-dej{--c:var(--k-petit-dej);--on-c:var(--k-petit-dej-on)}
.t-salades{--c:var(--k-salades);--on-c:var(--k-salades-on)}
.t-soupes{--c:var(--k-soupes);--on-c:var(--k-soupes-on)}
.t-tajines{--c:var(--k-tajines);--on-c:var(--k-tajines-on)}
.t-sandwichs{--c:var(--k-sandwichs);--on-c:var(--k-sandwichs-on)}
.t-snacks{--c:var(--k-snacks);--on-c:var(--k-snacks-on)}
.t-desserts{--c:var(--k-desserts);--on-c:var(--k-desserts-on)}
.t-aclasser{--c:var(--k-aclasser);--on-c:var(--k-aclasser-on)}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.5;
  padding-block: 1.25rem 3rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 40rem; margin-inline: auto; }
#view { display: grid; gap: 1.1rem; outline: none; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 8.5vw, 2.7rem); line-height: 1.04; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
h1:focus { outline: none; }
h2 { font-size: 1.2rem; font-weight: 700; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sub { margin: -0.5rem 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }

.back {
  display: inline-flex; align-items: center; gap: 0.3rem; width: fit-content;
  min-height: 2.75rem; margin-block: -0.4rem; font-weight: 600; text-decoration: none;
}

/* Couleur et illustration par type */
.themed {
  --ia: var(--c);
  --ib: color-mix(in srgb, var(--c) 40%, var(--surface));
  --iw: var(--surface);
  --tint: color-mix(in srgb, var(--c) 13%, var(--surface));
  --edge: color-mix(in srgb, var(--c) 32%, var(--line));
}
.themed.feat {
  --ia: var(--on-c);
  --ib: color-mix(in srgb, var(--on-c) 42%, var(--c));
  --iw: var(--c);
}
.ic-box { display: block; flex: none; }
.ic-box svg { display: block; width: 100%; height: 100%; }
.ic .a { fill: var(--ia); }
.ic .b { fill: var(--ib); }
.ic .w { fill: var(--iw); }
.ic .s { fill: none; stroke: var(--ia); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ic .sw { fill: none; stroke: var(--iw); stroke-width: 2.4; stroke-linecap: round; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 2.8rem; padding: 0.4rem 1rem;
  width: fit-content; max-width: 100%; border-radius: 0.7rem; background: var(--accent); color: var(--on-accent);
  font: inherit; font-weight: 600; text-decoration: none; text-align: center; border: 1px solid var(--accent); cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn[disabled] { opacity: 0.6; cursor: progress; }

/* Niveau 1 : types */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: 0.7rem; margin-top: 0.2rem; }
.tile {
  display: flex; flex-direction: column; justify-content: space-between; gap: 0.7rem;
  min-height: 7.8rem; padding: 0.8rem 0.9rem 0.85rem; min-width: 0;
  background: var(--tint); border: 1px solid var(--edge); border-radius: 1rem;
  color: var(--fg); text-decoration: none;
}
.tile .ic-box { width: 3.1rem; height: 3.1rem; }
.tile .txt { display: grid; }
.tile.feat { background: var(--c); border-color: var(--c); color: var(--on-c); }
.tile.feat .tc { color: var(--on-c); opacity: 0.92; }
.tn { font-family: var(--font-display); font-weight: 700; font-size: 1.22rem; line-height: 1.12; hyphens: manual; overflow-wrap: break-word; }
.tc { font-size: 0.84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.zero { background: transparent; border-style: dashed; }
.tile.zero .tn { color: var(--muted); }
.tile.zero .ic-box { opacity: 0.6; }
.tile.queue { grid-column: 1 / -1; min-height: 4.2rem; background: transparent; border-style: dashed; flex-direction: row; align-items: center; justify-content: flex-start; gap: 0.8rem; --c: var(--muted); }
.tile.queue .ic-box { width: 2.4rem; height: 2.4rem; }
.tile.queue .tn { font-size: 1.05rem; }
@media (hover: hover) { .tile:hover, .dish:hover { border-color: var(--c, var(--accent)); } }
.tile:active, .dish:active { filter: brightness(0.96); }

/* Niveau 2 : plats d'un type */
.banner {
  display: flex; align-items: center; gap: 1rem; padding: 1rem;
  background: var(--tint); border: 1px solid var(--edge); border-radius: 1.1rem;
}
.banner .ic-box { width: 4.4rem; height: 4.4rem; }
.banner h1 { font-size: clamp(1.7rem, 7.5vw, 2.3rem); }
.banner .sub { margin: 0.2rem 0 0; }
.dishes { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
.dish {
  display: flex; align-items: center; gap: 0.8rem;
  padding: 0.6rem 0.85rem 0.6rem 0.6rem; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 0.9rem;
  color: var(--fg); text-decoration: none;
}
.thumb { width: 3.6rem; height: 3.6rem; flex: none; border-radius: 0.7rem; background: var(--tint); display: grid; place-items: center; overflow: hidden; }
.thumb .ic-box { width: 2.5rem; height: 2.5rem; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dtxt { flex: 1; min-width: 0; display: grid; }
.dn { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; line-height: 1.22; overflow-wrap: anywhere; }
.ds { color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
.dm { color: var(--muted); font-size: 0.78rem; letter-spacing: 0.02em; margin-top: 0.15rem; }
.chev { font-size: 1.6rem; color: var(--c, var(--accent)); line-height: 1; }
.emptybox { padding: 1rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 0.9rem; display: grid; gap: 0.5rem; justify-items: start; }
.emptybox p { margin: 0; }

/* Niveau 3 : fiche d'un plat */
.hero { height: 8.5rem; border-radius: 1.1rem; background: var(--tint); border: 1px solid var(--edge); display: grid; place-items: center; overflow: hidden; }
.hero .ic-box { width: 6rem; height: 6rem; }
.hero.hasphoto { height: auto; border: 0; background: none; }
.photo { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; border-radius: 1.1rem; }
.meta { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-top: -0.3rem; }
.tag { font-size: 0.78rem; padding: 0.12rem 0.6rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.tag.src { background: var(--tint, var(--accent-soft)); border-color: transparent; color: var(--fg); font-weight: 600; }
.date { font-size: 0.8rem; color: var(--muted); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem; display: grid; gap: 0.8rem; min-width: 0; }
.sheet-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.4rem 0.8rem; }
.badge { font-size: 0.76rem; font-weight: 600; padding: 0.12rem 0.6rem; border-radius: 999px; background: var(--warn-bg); color: var(--warn-fg); }
.badge.ok { background: var(--accent-soft); color: var(--accent); }
.serv { margin: -0.4rem 0 0; color: var(--muted); font-size: 0.92rem; }
.ings { list-style: none; margin: 0; padding: 0; }
.ings li { position: relative; padding: 0.42rem 0 0.42rem 1.3rem; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.ings li:first-child { border-top: 0; }
.ings li::before { content: ""; position: absolute; left: 0.1rem; top: 1.02rem; width: 0.42rem; height: 0.42rem; border-radius: 50%; background: var(--c, var(--accent)); }
.probable { margin: 0; font-size: 0.9rem; color: var(--muted); font-style: italic; }
.note { margin: 0; font-size: 0.86rem; color: var(--muted); }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 0.7rem; }
.steps li { counter-increment: s; position: relative; padding-left: 2.2rem; overflow-wrap: anywhere; }
.steps li::before {
  content: counter(s); position: absolute; left: 0; top: 0.05rem; width: 1.55rem; height: 1.55rem; border-radius: 50%;
  display: grid; place-items: center; background: var(--c, var(--accent)); color: var(--on-c, var(--on-accent));
  font-size: 0.8rem; font-weight: 600; font-variant-numeric: tabular-nums;
}
.tips { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.35rem; color: var(--muted); font-size: 0.93rem; }
.tips-title { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 0.2rem 0 -0.4rem; }
.callout { margin: 0; padding: 0.7rem 0.85rem; border-radius: 0.7rem; background: var(--warn-bg); color: var(--warn-fg); font-size: 0.93rem; }
.rowbtns { display: flex; flex-wrap: wrap; gap: 0.6rem; }

/* Formulaire */
.form { display: grid; gap: 1.1rem; }
.field { display: grid; gap: 0.35rem; border: 0; padding: 0; margin: 0; min-width: 0; }
.lbl { font-weight: 600; font-size: 0.95rem; padding: 0; }
.help { font-size: 0.82rem; color: var(--muted); margin: 0; }
input[type="text"], input[type="url"], textarea {
  font: inherit; font-size: 1rem; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 0.7rem; padding: 0.65rem 0.75rem; min-height: 2.9rem; width: 100%;
}
textarea { min-height: 8.5rem; resize: vertical; line-height: 1.45; }
input[type="file"] { font: inherit; font-size: 0.95rem; max-width: 100%; }
.chipgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.6rem, 1fr)); gap: 0.5rem; }
.chip { position: relative; display: block; }
.chip input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.chip .cb {
  display: flex; align-items: center; gap: 0.5rem; min-height: 3.2rem; padding: 0.45rem 0.6rem;
  border: 1.5px solid var(--line); border-radius: 0.8rem; background: var(--surface);
  font-weight: 600; font-size: 0.92rem; line-height: 1.15; overflow-wrap: break-word; min-width: 0;
}
.chip .cb .ic-box { width: 1.9rem; height: 1.9rem; }
.chip .cb > span:not(.ic-box) { flex: 1; min-width: 0; }
.chip input:checked ~ .cb { background: var(--tint); border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.chip input:checked ~ .cb::after { content: "✓"; flex: none; margin-left: auto; color: var(--c); font-weight: 700; }
.chip input:focus-visible ~ .cb { outline: 2px solid var(--accent); outline-offset: 2px; }
.pprev { display: grid; gap: 0.5rem; justify-items: start; }
.pprev img { max-width: 100%; max-height: 14rem; border-radius: 0.8rem; display: block; }
.err { margin: 0; color: var(--danger); font-weight: 600; }
.status { margin: 0; color: var(--muted); font-size: 0.9rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.confirm { display: grid; gap: 0.6rem; padding: 0.85rem; border: 1px solid var(--danger); border-radius: 0.8rem; }
.confirm p { margin: 0; font-weight: 600; }

/* À identifier */
.qintro { margin: -0.4rem 0 0; color: var(--muted); font-size: 0.93rem; }
.qgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 0.9rem; }
.qgroup > summary { cursor: pointer; padding: 0.85rem 1rem; font-weight: 600; display: flex; justify-content: space-between; gap: 1rem; min-height: 2.75rem; }
.qgroup > summary .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.qlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.qlist li { display: grid; grid-template-columns: 3.6rem 1fr auto; gap: 0.5rem; align-items: center; padding: 0.3rem 1rem; border-top: 1px solid var(--line); min-height: 2.75rem; }
.qlist li:first-child { border-top: 0; }
.qid { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; }
.qdate { font-size: 0.92rem; min-width: 0; }
.qdate small { display: block; color: var(--warn-fg); background: var(--warn-bg); width: fit-content; padding: 0 0.4rem; border-radius: 0.3rem; }
.qlist a { font-size: 0.9rem; font-weight: 600; padding: 0.5rem 0; }
.hint { font-size: 0.82rem; color: var(--muted); margin: 0; }
.foot { margin: 0.4rem 0 0; font-size: 0.85rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0 1.4rem; }
.foot a, .linkbtn { display: inline-flex; align-items: center; min-height: 2.75rem; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; font-size: 0.85rem; color: var(--accent); text-decoration: underline; cursor: pointer; }
.reordering .rowbtns { position: sticky; top: 0.6rem; z-index: 20; }
.howto { margin-top: 0; padding: 0 1rem 0.9rem 2.2rem; }
.reordering .tile[data-type] { cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; position: relative; }
.grip { position: absolute; top: 0.6rem; right: 0.75rem; font-size: 1.2rem; line-height: 1; letter-spacing: -0.15em; opacity: 0.75; }
.tile.placeholder { opacity: 0.35; outline: 2px dashed var(--c); outline-offset: -2px; }
.tile.ghost { position: fixed; z-index: 100; margin: 0; pointer-events: none; box-shadow: 0 12px 30px rgba(0,0,0,0.3); transform: scale(1.04); opacity: 0.97; }
input[type="password"] { font: inherit; font-size: 1rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 0.7rem; padding: 0.65rem 0.75rem; min-height: 2.9rem; width: 100%; }
.seg { display: flex; gap: 0.25rem; padding: 0.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0.85rem; }
.seg a { flex: 1; display: grid; place-items: center; min-height: 2.6rem; border-radius: 0.65rem; color: var(--muted); font-weight: 600; text-decoration: none; }
.seg a[aria-current] { background: var(--accent); color: var(--on-accent); }
:root { --k-meal: #2B3A67; --k-meal-on: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --k-meal: #B4C2EE; --k-meal-on: #12141F; } }
:root[data-theme="dark"] { --k-meal: #B4C2EE; --k-meal-on: #12141F; }
.t-meal { --c: var(--k-meal); --on-c: var(--k-meal-on); }
.tile.wide { grid-column: 1 / -1; min-height: 4.2rem; flex-direction: row; align-items: center; justify-content: flex-start; gap: 0.8rem; }
.tile.wide .ic-box { width: 2.4rem; height: 2.4rem; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 0.9rem; overflow: hidden; }
.rows li + li { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 0.5rem; min-height: 2.75rem; padding: 0.3rem 0.5rem 0.3rem 0.85rem; color: var(--fg); text-decoration: none; }
.row:active { background: var(--tint, var(--accent-soft)); }
@media (hover: hover) { .row:hover { background: var(--tint, var(--accent-soft)); } }
.rn { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mchip { flex: none; font-size: 0.7rem; line-height: 1.5; padding: 0 0.45rem; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.dot { flex: none; opacity: 0.65; width: 0.5rem; height: 0.5rem; border-radius: 50%; border: 1.5px solid var(--muted); }
.grp { display: grid; gap: 0.45rem; }
.grp-head { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.3rem; padding-bottom: 0.3rem; border-bottom: 2px solid var(--c); }
.grp-head .ic-box { width: 1.9rem; height: 1.9rem; }
.grp-head h2 { font-size: 1.05rem; color: var(--fg); }
.grp-head .grp-n { margin-left: auto; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.more { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 2.75rem; background: none; border: 0; padding: 0; font: inherit; font-size: 1.4rem; line-height: 1; letter-spacing: 0.1em; color: var(--muted); cursor: pointer; }
.more[aria-expanded="true"] { font-size: 0.85rem; letter-spacing: 0; }
@media (hover: hover) { .more:hover { background: var(--tint, var(--accent-soft)); color: var(--fg); } }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
</style>

          msg.textContent = 'Dépôt accessible en lecture. Ajoutez un jeton pour pouvoir modifier.';
        }
        refreshData(true);
      }, function (e) {
        save.disabled = false; msg.textContent = '';
        err.textContent = e.status === 401 ? 'Jeton refusé ou expiré.'
          : e.status === 404 ? 'Dépôt introuvable. Vérifiez son nom et que le jeton y a accès.'
          : !e.status ? 'Pas de connexion. Réessayez.' : 'Échec du test (' + e.status + ').';
      });
    });
    view.appendChild(f);
  }

  function missingScreen() {
    view.appendChild(back('#accueil', 'Types de plats'));
    view.appendChild(el('h1', null, 'Recette introuvable'));
    view.appendChild(el('p', 'sub', 'Cette recette n’existe plus ou n’est pas encore chargée.'));
  }

  /* Liens à identifier */
  function queueScreen() {
    view.appendChild(back('#accueil', 'Types de plats'));
    view.appendChild(el('h1', null, 'Liens à identifier'));
    view.appendChild(el('p', 'qintro', 'Ces liens ont été partagés comme recettes, mais leur nom n’est pas connu. Le numéro permet de les citer dans le chat.'));
    function group(title, rows) {
      var d = el('details', 'qgroup');
      var s = el('summary'); s.appendChild(el('span', null, title)); s.appendChild(el('span', 'n', plural(rows.length, 'lien', 'liens'))); d.appendChild(s);
      var ul = el('ul', 'qlist');
      rows.forEach(function (r) {
        var li = el('li');
        li.appendChild(el('span', 'qid', r.id));
        var dd = el('span', 'qdate', fmt(r.date));
        if (r.note) dd.appendChild(el('small', null, r.note));
        li.appendChild(dd);
        li.appendChild(ext(r.url, null, 'Ouvrir ↗'));
        ul.appendChild(li);
      });
      d.appendChild(ul); return d;
    }
    view.appendChild(group('YouTube', D.pendingYt.map(function (r, i) { return { id: 'Y' + (i + 1), date: r.date, url: r.url, note: r.note }; })));
    var k = 0;
    Object.keys(D.pendingFb).sort().forEach(function (y) {
      view.appendChild(group('Facebook ' + y, D.pendingFb[y].map(function (r) { k += 1; return { id: 'F' + k, date: r.date, url: r.url }; })));
    });
    view.appendChild(el('p', 'hint', 'Facebook demande parfois de se connecter pour ouvrir un reel.'));
  }

  function rerender() {
    var h = location.hash || '';
    if (formActive || reorder || h === '#a-identifier') return;
    route(true);
  }
  function route(quiet) {
    var h = (location.hash || '').replace(/^#/, '');
    formActive = false;
    view.textContent = '';
    view.className = '';
    var rec;
    if (byId[h]) recipeScreen(byId[h]);
    else if (tById[h]) typeScreen(tById[h]);
    else if (h.indexOf('repas/') === 0 && (mById[h.slice(6)] || h.slice(6) === 'sans')) mealScreen(h.slice(6));
    else if (h === 'a-identifier') queueScreen();
    else if (h === 'reglages') settingsScreen();
    else if (h === 'ajouter' || h.indexOf('ajouter/') === 0) formScreen(null, h.slice(8));
    else if (h.indexOf('modifier/') === 0) {
      rec = byId[h.slice(9)];
      if (rec) formScreen(rec); else missingScreen();
    }
    else if (h === 'repas') home('repas');
    else if (h === 'accueil') home('types');
    else home(lsGet('carnet:view'));
    if (quiet === true) return;
    try { window.scrollTo(0, 0); } catch (e) {}
    if (!firstRoute) {
      var t = view.querySelector('h1');
      if (t) { t.tabIndex = -1; try { t.focus({ preventScroll: true }); } catch (e) {} }
    }
    firstRoute = false;
  }

  window.addEventListener('hashchange', function () { reorder = false; route(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshData(false); });
  window.addEventListener('online', function () { refreshData(true); });
  route();
  refreshData(true);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
